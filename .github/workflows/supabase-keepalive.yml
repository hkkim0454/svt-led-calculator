# Supabase keep-alive (DEC-169)
# Free-plan Supabase projects pause after about a week without requests.
# This workflow sends the same read-only list requests the site makes, without
# any password, every 3 days. RLS returns an empty list, so no data is read or
# changed. URL and publishable key come from src/share-remote.js (single source).
# Note: GitHub disables scheduled workflows after 60 days without repository
# activity. Re-enable from the Actions tab if that happens.
name: Supabase keep-alive

on:
  schedule:
    - cron: '17 0 */3 * *'   # 00:17 UTC (09:17 KST) on day 1, 4, 7, ... of each month
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Ping Supabase REST API
        run: |
          node --input-type=module -e "
          import { listCases, listShared } from './src/share-remote.js';
          const cases = await listCases('');
          const shared = await listShared('');
          console.log('install_cases rows:', cases.length, '/ shared_configs rows:', shared.length);
          "
